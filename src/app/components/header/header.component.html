<div class="header-container fixed-top">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center py-2">
      <div>
        <h3 class="mb-1 text-cyan">{{personal_data.name}}</h3>
        <h6 class="text-blue mb-0">{{personal_data.role}}</h6>
      </div>
      <div class="d-flex align-items-center">
        <a [href]="personal_data.linkedIn" target="_blank" class="me-3">
          <i class="bi bi-linkedin fs-4 text-cyan header-icon"></i>
        </a>
        <a [href]="'mailto:' + personal_data.email" class="text-decoration-none">
          <i class="bi bi-envelope fs-4 text-cyan header-icon"></i>
        </a>
      </div>
    </div>
  </div>
</div>
